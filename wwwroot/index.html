<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>포켓몬 헬퍼</title>
    <style>
        :root {
            --bg-color: #1e1f22;
            --panel-bg: #2b2d31;
            --panel-border: #3f4147;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --stat-hp: #ffb6c1;
            --stat-atk: #add8e6;
            --stat-def: #90ee90;
            --btn-active: #23a559;
            --border-active-my: #5865f2;
            --border-active-sim: #fee75c;
        }

        body {
            font-family: 'Segoe UI', 'Malgun Gothic', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-size: 18px;
            /* Increased by 1.2x per user request */
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .header-bar .status {
            color: #43b581;
            font-weight: bold;
        }

        .header-bar .center-btn {
            background-color: transparent;
            border: 1px solid #7289da;
            color: var(--text-main);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            cursor: pointer;
        }

        .header-bar .version {
            color: var(--text-muted);
            font-size: 0.8em;
        }

        .section-title {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        /* 3x2 Grid for Top Party */
        .party-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            min-height: 240px;
        }

        .party-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            align-items: stretch;
            padding: 4px;
        }

        .party-card .moves-col {
            flex: 1;
            padding: 4px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: center;
            border-right: 1px solid var(--panel-border);
        }

        .party-card .pokemon-col {
            width: 120px;
            padding: 4px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pokemon-col img.sprite {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .pokemon-col .types {
            display: flex;
            gap: 4px;
            margin-bottom: 2px;
        }

        .pokemon-col .types img {
            width: 14px;
            height: 14px;
        }

        .pokemon-col .name {
            font-size: 0.9em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .pokemon-col .stats {
            display: flex;
            gap: 4px;
            position: absolute;
            bottom: 4px;
        }

        .stat-box {
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 0.8em;
            font-weight: bold;
            color: #000;
        }

        .stat-box.hp {
            background-color: var(--stat-hp);
        }

        .stat-box.atk {
            background-color: var(--stat-atk);
        }

        .stat-box.def {
            background-color: var(--stat-def);
        }

        .move-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            width: 100%;
            padding: 2px 0;
        }

        .move-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85px;
        }

        .move-dmg {
            background: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1em;
            text-align: center;
            min-width: 50px;
        }

        .move-dmg-boxes {
            display: flex;
            gap: 8px;
        }

        .move-dmg-box {
            color: #000;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.85em;
            text-align: center;
            width: 65px;
            border: 1px solid #ccc;
            background-color: #ffffff;
        }

        .move-dmg-box.large {
            width: 100px;
            padding: 4px 6px;
            font-size: 0.95em;
        }

        .move-dmg-box.phys-max {
            background-color: #ffc0cb;
            border-color: #ffb6c1;
        }

        .move-dmg-box.phys-semi {
            background-color: #ffe4e1;
            border-color: #ffcdd2;
        }

        .move-dmg-box.spec-max {
            background-color: #e1bee7;
            border-color: #ce93d8;
        }

        .move-dmg-box.spec-semi {
            background-color: #f3e5f5;
            border-color: #e1bee7;
        }

        .move-dmg-box.zero {
            background-color: #ffffff;
            border-color: #e0e0e0;
        }

        /* Middle Simulation Area */
        .simulator-area {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            margin: 5px 0;
            display: flex;
            flex-direction: column;
            min-height: 300px;
            /* Doubled height per user request */
        }

        .sim-toolbar {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            border-bottom: 1px solid var(--panel-border);
            font-size: 0.85em;
        }

        .sim-toolbar select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 3px;
        }

        .sim-content {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            padding: 0;
        }

        .sim-side {
            display: flex;
            align-items: stretch;
            gap: 0;
        }

        .sim-side.right {
            flex-direction: row-reverse;
        }

        .sim-pokemon {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sim-pokemon img.sprite {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        /* Increased sprite size */
        .sim-pokemon .types {
            display: flex;
            gap: 2px;
        }

        .sim-pokemon .types img {
            width: 12px;
            height: 12px;
        }

        .sim-pokemon .name {
            font-weight: bold;
            margin: 5px 0;
            font-size: 0.95em;
        }

        .sim-pokemon .hp-bar {
            width: 120px;
            height: 6px;
            background: #43b581;
            border-radius: 3px;
            margin-top: 5px;
        }

        .sim-pokemon .hp-text {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .sim-moves {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sim-moves .move-row {
            gap: 8px;
            font-size: 0.95em;
        }

        /* Status/Rank sidebar boxes in the sim area */
        .sim-status-box {
            width: 76px;
            min-height: unset;
            align-self: stretch;
            background: #2e3035;
            border-right: 1px solid #555;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 4px 3px;
            gap: 3px;
            flex-shrink: 0;
        }

        /* sim-side.right의 status box는 오른쪽 테두리 반전 */
        .sim-side.right .sim-status-box {
            border-right: none;
            border-left: 1px solid #555;
        }

        .sim-status-box .status-badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.78em;
            font-weight: bold;
            text-align: center;
            width: 68px;
        }

        .status-badge.prz {
            background: #f4ca58;
            color: #000;
        }

        .status-badge.brn {
            background: #e67e22;
            color: #fff;
        }

        .status-badge.psn {
            background: #9b59b6;
            color: #fff;
        }

        .status-badge.tox {
            background: #8e44ad;
            color: #fff;
        }

        .status-badge.slp {
            background: #7f8c8d;
            color: #fff;
        }

        .status-badge.frz {
            background: #5dade2;
            color: #fff;
        }

        .status-badge.none {
            background: transparent;
            color: transparent;
        }

        .rank-badge {
            display: block;
            width: 68px;
            text-align: center;
            font-size: 0.78em;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .rank-badge.up {
            background: #e74c3c;
            color: #fff;
        }

        .rank-badge.down {
            background: #3498db;
            color: #fff;
        }

        .rank-badge.neut {
            color: var(--text-muted);
        }

        .sim-status-label {
            font-size: 0.72em;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2px;
        }

        /* Bottom Section: My Party vs Opponent Party */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 5px;
        }

        .small-party {
            display: flex;
            gap: 8px;
        }

        .small-card {
            width: 75px;
            text-align: center;
            background: var(--panel-bg);
            border: 2px solid transparent;
            border-radius: 4px;
            padding: 4px;
            cursor: pointer;
            opacity: 0.7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .small-card.active {
            border-color: var(--border-active-my);
            opacity: 1;
        }

        .small-card.opponent-active {
            border-color: var(--border-active-sim);
            opacity: 1;
        }

        .small-card img.sprite {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 3px;
        }

        .small-card .types {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 3px;
        }

        .small-card .types img {
            width: 12px;
            height: 12px;
        }

        .small-card .name {
            font-size: 0.85em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .center-action button {
            background-color: #3b3e45;
            color: var(--text-main);
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .center-action button.active {
            background-color: var(--btn-active);
        }

        /* Detailed Info Panels */
        .detail-panels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            gap: 20px;
        }

        .detail-panel {
            width: 380px;
            max-width: 48%;
            flex: none;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 12px;
            background: var(--panel-bg);
        }

        .detail-panel h4 {
            margin: 0 0 6px 0;
            font-size: 0.95em;
            color: #f1c40f;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.95em;
            align-items: center;
        }

        .detail-row select {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            padding: 3px;
            margin-left: 8px;
            font-size: 0.95em;
        }

        .detail-row span.label {
            width: 50px;
            color: var(--text-muted);
        }

        /* Footer */
        .footer-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .footer-bar button {
            background-color: #3b3e45;
            color: var(--text-main);
            border: none;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
        }

        /* Battle Logger Area */
        #battle-logger {
            flex: 1;
            overflow-y: auto;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            margin-top: 10px;
            padding: 8px;
            font-size: 0.85em;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            color: var(--text-main);
            word-break: break-all;
        }
        
        .log-time {
            color: var(--text-muted);
            margin-right: 6px;
        }
    </style>
</head>

<body>
    <div class="header-bar">
        <div class="status" id="connectionStatus">데이터 수신 중</div>
        <button class="center-btn" onclick="resetBattle()">배틀 상태 초기화</button>
        <div class="version">v0.189</div>
    </div>

    <div class="section-title" id="topGridTitle">상대 파티 (내 현재 포켓몬 기준 위력)</div>

    <div class="party-grid" id="topPartyGrid"></div>

    <div class="simulator-area">
        <div class="sim-toolbar">
            <div style="display: flex; gap: 10px;">
                <div>타입 <select id="myTypeSelect" onchange="renderAll()">
                        <option value="">기본</option>
                        <option value="NORMAL">노말</option><option value="FIRE">불꽃</option><option value="WATER">물</option><option value="GRASS">풀</option>
                        <option value="ELECTRIC">전기</option><option value="ICE">얼음</option><option value="FIGHTING">격투</option><option value="POISON">독</option>
                        <option value="GROUND">땅</option><option value="FLYING">비행</option><option value="PSYCHIC">에스퍼</option><option value="BUG">벌레</option>
                        <option value="ROCK">바위</option><option value="GHOST">고스트</option><option value="DRAGON">드래곤</option><option value="DARK">악</option>
                        <option value="STEEL">강철</option><option value="FAIRY">페어리</option>
                    </select></div>
                <div>벽 <select id="myScreenSelect" onchange="renderAll()">
                        <option value="">없음</option>

                        <option value="">없음</option>
                        <option value="Active">적용</option>
                    </select></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div>필드 <select id="terrainSelect" onchange="renderAll()">
                        <option value="None">없음</option>
                        <option value="Electric">일렉트릭 (전기 1.3배)</option>
                        <option value="Grassy">그래스 (풀 1.3배)</option>
                        <option value="Psychic">사이코 (에스퍼 1.3배)</option>
                        <option value="Misty">미스트 (드래곤 0.5배)</option>
                    </select></div>
                <div>날씨 <select id="weatherSelect" onchange="handleWeatherSelect()">
                        <option value="None">없음</option>
                        <option value="Sun">쾌청 (불 1.5, 물 0.5)</option>
                        <option value="Rain">비 (물 1.5, 불 0.5)</option>
                        <option value="Sand">모래바람 (바위 특방 1.5배)</option>
                        <option value="Snow">싸라기눈 (얼음 방어 1.5배)</option>
                    </select></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div>순풍 <select id="oppTailwindSelect" onchange="renderAll()">
                        <option value="">없음</option>
                        <option value="Active">적용</option>
                    </select></div>
                <div>벽 <select id="oppScreenSelect" onchange="renderAll()">
                        <option value="">없음</option>
                        <option value="Reflect">리플렉터 (물리 반감)</option>
                        <option value="LightScreen">빛의장막 (특수 반감)</option>
                        <option value="AuroraVeil">오로라베일 (모두 반감)</option>
                    </select></div>
                <div>타입 <select id="oppTypeSelect" onchange="renderAll()">
                        <option value="">기본</option>
                        <option value="NORMAL">노말</option><option value="FIRE">불꽃</option><option value="WATER">물</option><option value="GRASS">풀</option>
                        <option value="ELECTRIC">전기</option><option value="ICE">얼음</option><option value="FIGHTING">격투</option><option value="POISON">독</option>
                        <option value="GROUND">땅</option><option value="FLYING">비행</option><option value="PSYCHIC">에스퍼</option><option value="BUG">벌레</option>
                        <option value="ROCK">바위</option><option value="GHOST">고스트</option><option value="DRAGON">드래곤</option><option value="DARK">악</option>
                        <option value="STEEL">강철</option><option value="FAIRY">페어리</option>
                    </select></div>
            </div>
        </div>
        <div class="sim-content" id="simContent"></div>
    </div>

    <div class="section-title" style="margin-top:0;">파티 (현재=파랑테, 시뮬=노랑테)</div>
    <div class="bottom-section">
        <div>
            <div class="section-title" style="color:var(--text-main);">내 파티</div>
            <div class="small-party" id="myPartySmall"></div>
        </div>
        <div class="center-action">
            <button id="togglePerspectiveBtn">상대</button>
        </div>
        <div>
            <div class="section-title" style="color:var(--text-main); text-align:right;">상대 파티</div>
            <div class="small-party" id="opponentPartySmall"></div>
        </div>
    </div>

    <div class="detail-panels">
        <div class="detail-panel" id="myDetailPanel">
            <h4>현재 내 포켓몬: -</h4>
            <div class="detail-row"><span class="label">지닌도구</span><select id="myItemSelect">
                    <option>자뭉열매</option>
                </select></div>
            <div class="detail-row"><span class="label">특성</span><select id="myAbilitySelect">
                    <option>유연</option>
                </select></div>
            <div class="detail-row"><span class="label">성격</span><select>
                    <option>명랑</option>
                </select></div>
            <div class="detail-row"><span class="label">노력치</span><select>
                    <option>H4 A252 S252</option>
                </select></div>
            <div class="detail-row"><span class="label">랭크</span><span id="myRankDisplay"
                    style="color:#f39c12;font-size:0.9em;">-</span></div>
        </div>
        <div class="detail-panel" id="opponentDetailPanel">
            <h4>현재 상대: -</h4>
            <div class="detail-row"><span class="label">지닌도구</span><select id="oppItemSelect">
                    <option>알 수 없음</option>
                </select></div>
            <div class="detail-row"><span class="label">특성</span><select id="oppAbilitySelect">
                    <option>알 수 없음</option>
                </select></div>

                    <option>알 수 없음</option>

                    <option>알 수 없음</option>

        </div>
    </div>

    <div class="footer-bar">
        <button>실제 수치</button>
        <button>선출 정보</button>
    </div>

    <!-- Battle Logger -->
    <div id="battle-logger"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script>
        // State
        let isOpponentPerspective = false;
        let myParty = [];
        let opponentParty = [];
        let myActiveIndex = -1;
        let opponentActiveIndex = -1;

        // Logger Function
        function addLog(msg) {
            const logger = document.getElementById("battle-logger");
            if (!logger) return;
            const time = new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            const logEntry = document.createElement("div");
            logEntry.className = "log-entry";
            
            const timeSpan = document.createElement("span");
            timeSpan.className = "log-time";
            timeSpan.innerText = `[${time}]`;
            
            logEntry.appendChild(timeSpan);
            logEntry.appendChild(document.createTextNode(msg));
            
            logger.appendChild(logEntry);
            
            // Auto scroll to bottom
            logger.scrollTop = logger.scrollHeight;
        }

        function changeMyActive(index) {
            myActiveIndex = index;
            myMaxHpKnown = NaN;
            if (index >= 0 && myParty[index]) {
                if (myParty[index].currentHpFraction === undefined) {
                    let maxHp = "-";
                    const dexId = myParty[index].SpeciesId || myParty[index].dexId;
                    if (dexId && masterDataMap[dexId] && masterDataMap[dexId].baseStats) {
                        maxHp = getMyActualStats(myParty[index], masterDataMap[dexId].baseStats).hp;
                    }
                    myParty[index].currentHpFraction = 1.0;
                    myParty[index].currentHpText = maxHp !== "-" ? `HP ${maxHp} / ${maxHp}` : "HP - / -";
                }
                currentHpFractionMy = myParty[index].currentHpFraction;
                currentMyHpText = myParty[index].currentHpText;
            }
        }

        function changeOpponentActive(index) {
            opponentActiveIndex = index;
            oppMaxHpKnown = NaN;
            if (index >= 0 && opponentParty[index]) {
                if (opponentParty[index].currentHpFraction === undefined) {
                    opponentParty[index].currentHpFraction = 1.0;

        function applyItemModifiers(move, attackerItem, defenderItem) {

        function applyAbilityModifiers(attackerStats, defenderStats, move, attackerTypes, defenderTypes, attackerAbility, defenderAbility, attackerHpFraction, defenderHpFraction, currentTypeEff) {
            let mods = { dmgMult: 1.0, atkMult: 1.0, defMult: 1.0, bpMult: 1.0 };

                if (defenderHpFraction >= 1.0 && (defenderAbility === "멀티스케일" || defenderAbility === "스펙터가드")) mods.dmgMult *= 0.5;

            if (attackerAbility === "재앙의검" && move.category === "PHYSICAL") mods.defMult *= 0.75;
            if (attackerAbility === "재앙의구슬" && move.category === "SPECIAL") mods.defMult *= 0.75;
            if (defenderAbility === "재앙의목간" && move.category === "PHYSICAL") mods.atkMult *= 0.75;

            return mods;

        const TYPE_CHART = {
            NORMAL: { ROCK: 0.5, GHOST: 0, STEEL: 0.5 },

        };

        function getTypeEffectiveness(moveType, targetTypes) {
            if (!moveType || !targetTypes || targetTypes.length === 0) return 1.0;
            let eff = 1.0;
            const effMap = TYPE_CHART[moveType.toUpperCase()];
            if (effMap) {
                targetTypes.forEach(t => {
                    const tUpper = t.toUpperCase();
                    if (effMap[tUpper] !== undefined) eff *= effMap[tUpper];
                });
            }
            return eff;
        }

        function calculateDamage(attackerStats, defenderStats, move, attackerTypes, defenderTypes, attackerItem, defenderItem, attackerAbility, defenderAbility, attackerHpFraction, defenderHpFraction, attackerStatus, defenderScreen, currentTerrain) {
            if (!move || move.category === 'STATUS' || move.power === 0) return { minRaw: 0, maxRaw: 0, min: '0.0', max: '0.0' };

            let atkStat = move.category === 'PHYSICAL' ? attackerStats.atk : attackerStats.spa;
            let defStat = move.category === 'PHYSICAL' ? defenderStats.def : defenderStats.spd;
            if (!atkStat || !defStat || !defenderStats.hp) return { minRaw: 0, maxRaw: 0, min: '0.0', max: '0.0', minScalar: 0, maxScalar: 0 };
            
            // Sandstorm boosts Sp.Def for Rock types
            if (currentWeather === 'Sand' && move.category === 'SPECIAL' && defenderTypes.includes('ROCK')) {
                defStat = Math.floor(defStat * 1.5);
            }
            // Snow boosts Def for Ice types
            if (currentWeather === 'Snow' && move.category === 'PHYSICAL' && defenderTypes.includes('ICE')) {
                defStat = Math.floor(defStat * 1.5);
            }

            const mods = applyItemModifiers(move, attackerItem, defenderItem);
            const eff = getTypeEffectiveness(move.type, defenderTypes);
            const aMods = applyAbilityModifiers(attackerStats, defenderStats, move, attackerTypes, defenderTypes, attackerAbility, defenderAbility, attackerHpFraction, defenderHpFraction, eff);

            atkStat = Math.floor(atkStat * mods.atkMult * aMods.atkMult);
            defStat = Math.floor(defStat * mods.defMult * aMods.defMult);

            let basePower = Math.floor(move.power * aMods.bpMult);
            
            // Terrain modifiers
            const isAttackerGrounded = !attackerTypes.includes('FLYING') && attackerAbility !== '부유';
            const isDefenderGrounded = !defenderTypes.includes('FLYING') && defenderAbility !== '부유';
            if (currentTerrain === 'Electric' && isAttackerGrounded && move.type === 'ELECTRIC') basePower = Math.floor(basePower * 1.3);
            if (currentTerrain === 'Grassy' && isAttackerGrounded && move.type === 'GRASS') basePower = Math.floor(basePower * 1.3);
            if (currentTerrain === 'Grassy' && isDefenderGrounded && (move.nameKo === '지진' || move.nameKo === '땅고르기' || move.nameKo === '매그니튜드')) basePower = Math.floor(basePower * 0.5);
            if (currentTerrain === 'Psychic' && isAttackerGrounded && move.type === 'PSYCHIC') basePower = Math.floor(basePower * 1.3);
            if (currentTerrain === 'Misty' && isDefenderGrounded && move.type === 'DRAGON') basePower = Math.floor(basePower * 0.5);

            let baseDamage = Math.floor(Math.floor(Math.floor(22) * basePower * atkStat / defStat) / 50) + 2;
            
            // Weather damage modifiers
            if (currentWeather === 'Rain') {
                if (move.type === 'WATER') baseDamage = Math.floor(baseDamage * 1.5);
                if (move.type === 'FIRE') baseDamage = Math.floor(baseDamage * 0.5);
            } else if (currentWeather === 'Sun') {
                if (move.type === 'FIRE') baseDamage = Math.floor(baseDamage * 1.5);
                if (move.type === 'WATER') baseDamage = Math.floor(baseDamage * 0.5);
            }

            // Burn status halves physical damage (except Guts)
            if (attackerStatus === 'BRN' && move.category === 'PHYSICAL' && attackerAbility !== '근성') {
                baseDamage = Math.floor(baseDamage * 0.5);
            }

            // Screens
            if (defenderScreen === 'Reflect' && move.category === 'PHYSICAL') {
                baseDamage = Math.floor(baseDamage * 0.5);
            } else if (defenderScreen === 'LightScreen' && move.category === 'SPECIAL') {
                baseDamage = Math.floor(baseDamage * 0.5);
            } else if (defenderScreen === 'AuroraVeil') {
                baseDamage = Math.floor(baseDamage * 0.5);
            }

            if (attackerTypes.some(t => t.toUpperCase() === move.type.toUpperCase())) {
                baseDamage = Math.floor(baseDamage * 1.5);
            }

            baseDamage = Math.floor(baseDamage * eff);
            if (eff === 0) return { minRaw: 0, maxRaw: 0, min: '0.0', max: '0.0', minScalar: 0, maxScalar: 0 };

            const minDmg = Math.floor(baseDamage * 0.85 * mods.dmgMult * aMods.dmgMult);
            const maxDmg = Math.floor(baseDamage * 1.00 * mods.dmgMult * aMods.dmgMult);

            const minRaw = minDmg / defenderStats.hp * 100;
            const maxRaw = maxDmg / defenderStats.hp * 100;

            return {
                minRaw: minRaw,
                maxRaw: maxRaw,
                min: minRaw.toFixed(1),
                max: maxRaw.toFixed(1),
                minScalar: minDmg,
                maxScalar: maxDmg
            };
        }

        function getOpponentStats(baseStats, isMax, isNaturePlus) {
            const hp = Math.floor((baseStats.hp * 2 + 31) / 2) + 60 + (isMax ? 32 : 0);
            const getStat = (base) => Math.floor((Math.floor((base * 2 + 31) / 2) + 5 + (isMax ? 32 : 0)) * (isNaturePlus ? 1.1 : 1.0));
            return {
                hp: hp,
                atk: getStat(baseStats.atk),
                def: getStat(baseStats.def),
                spa: getStat(baseStats.spa),
                spd: getStat(baseStats.spd),
                spe: getStat(baseStats.spe)
            };
        }

        function getMyActualStats(myActive, baseStats) {
            const evs = myActive.Evs || {};
            const hp = Math.floor((baseStats.hp * 2 + 31) / 2) + 60 + (evs["Hp"] || 0);
            const getStat = (base, key, isPlus, isMinus) => {
                let val = Math.floor((base * 2 + 31) / 2) + 5 + (evs[key] || 0);
                let mult = 1.0;
                if (isPlus) mult = 1.1;
                else if (isMinus) mult = 0.9;
                return Math.floor(val * mult);
            };
            const n = myActive.NatureKo || "";
            const natureMap = {
                "외로운": ["Atk", "Def"], "용감": ["Atk", "Spe"], "고집": ["Atk", "Spa"], "개구쟁이": ["Atk", "Spd"],
                "대담": ["Def", "Atk"], "무사태평": ["Def", "Spe"], "장난꾸러기": ["Def", "Spa"], "촐랑": ["Def", "Spd"],
                "겁쟁이": ["Spe", "Atk"], "성급": ["Spe", "Def"], "명랑": ["Spe", "Spa"], "천진난만": ["Spe", "Spd"],
                "조심": ["Spa", "Atk"], "의젓": ["Spa", "Def"], "냉정": ["Spa", "Spe"], "덜렁": ["Spa", "Spd"],
                "차분": ["Spd", "Atk"], "얌전": ["Spd", "Def"], "건방": ["Spd", "Spe"], "신중": ["Spd", "Spa"]
            };
            let plus = null, minus = null;
            if (natureMap[n]) { plus = natureMap[n][0]; minus = natureMap[n][1]; }
            return {
                hp: hp,
                atk: getStat(baseStats.atk, "Atk", plus === "Atk", minus === "Atk"),
                def: getStat(baseStats.def, "Def", plus === "Def", minus === "Def"),
                spa: getStat(baseStats.spa, "Spa", plus === "Spa", minus === "Spa"),
                spd: getStat(baseStats.spd, "Spd", plus === "Spd", minus === "Spd"),
                spe: getStat(baseStats.spe, "Spe", plus === "Spe", minus === "Spe")
            };
        }

        function getSpeeds(baseSpe, item, status, isTailwindActive) {
            if (!baseSpe) return { max: 'ERR', semi: 'ERR', uninvested: 'ERR' };
            const uninvested = Math.floor((baseSpe * 2 + 31) / 2) + 5;
            const semi = Math.floor((baseSpe * 2 + 31 + 63) / 2) + 5;
            const max = Math.floor(semi * 1.1);

            let mult = (item === "구애스카프") ? 1.5 : 1.0;
            if (status === "PRZ") mult *= 0.5;
            if (isTailwindActive) mult *= 2.0;
            return {
                max: Math.floor(max * mult),
                semi: Math.floor(semi * mult),
                uninvested: Math.floor(uninvested * mult)
            };
        }

        function getMyActualSpeed(myActive, item, status, isTailwindActive) {
            if (!myActive) return "-";
            let spe = 0;
            if (myActive.Stats && myActive.Stats.Spe) spe = myActive.Stats.Spe;
            else if (myActive.stats && myActive.stats.spe) spe = myActive.stats.spe;
            else {
                const dexId = myActive.SpeciesId || myActive.dexId;
                const masterInfo = masterDataMap[dexId];
                if (!masterInfo || !masterInfo.baseStats) return "-";

                const baseSpe = masterInfo.baseStats.spe;
                const uninvested = Math.floor((baseSpe * 2 + 31) / 2) + 5;
                const evBump = (myActive.Evs && myActive.Evs.Spe) ? myActive.Evs.Spe : 0;

                let natureMult = 1.0;
                const nature = myActive.NatureKo || "";
                if (["명랑", "겁쟁이", "천진난만", "성급"].includes(nature)) natureMult = 1.1;
                else if (["용감", "무사태평", "냉정", "건방"].includes(nature)) natureMult = 0.9;

                spe = Math.floor((uninvested + evBump) * natureMult);
            }
            if (item === "구애스카프") spe = Math.floor(spe * 1.5);
            if (status === "PRZ") spe = Math.floor(spe * 0.5);
            if (isTailwindActive) spe = Math.floor(spe * 2.0);
            return spe;
        }

        function getUsageForDexId(dexId) {
            if (!usageDataMap || !dexId) return null;

            // Search deeply in the JSON structure for an object with the matching dexId
            let found = null;
            function searchObj(obj) {
                if (found || !obj) return;
                if (Array.isArray(obj)) {
                    for (let i = 0; i < obj.length; i++) {
                        if (obj[i] && obj[i].dexId == dexId) { found = obj[i]; return; }
                        if (typeof obj[i] === 'object') searchObj(obj[i]);
                    }
                } else if (typeof obj === 'object') {
                    if (obj.dexId == dexId) { found = obj; return; }
                    for (let k in obj) {
                        if (typeof obj[k] === 'object') searchObj(obj[k]);
                    }
                }
            }
            searchObj(usageDataMap);
            return found;
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/pokemonHub")

            .build();

            opponentParty = partyData;
            
            // 초기 체력 히스토리 리스트를 100%로 꽉 채우지 않습니다 (나온 포켓몬만 띄우기 위함)

        let lastLoggedMyHpText = "";
        let lastLoggedOppHpText = "";
        
        connection.on("UpdateHpEvent", function (ev) {
            let changed = false;

            if (ev.myHpParsed !== undefined && ev.myHpParsed !== "") {
                let cur = parseFloat(ev.myHpParsed);
                let max = NaN;

                // 파티 샘플 데이터에서 최대 체력(Max HP)을 직접 계산해서 가져옵니다
                if (myActiveIndex >= 0 && myParty[myActiveIndex]) {
                    let myActive = myParty[myActiveIndex];
                    if (myActive.Stats && myActive.Stats.Hp) {
                        max = myActive.Stats.Hp;
                    } else if (myActive.stats && myActive.stats.hp) {
                        max = myActive.stats.hp;
                    } else {
                        const baseStats = masterDataMap[myActive.SpeciesId || myActive.dexId]?.baseStats;
                        if (baseStats) {
                            max = getMyActualStats(myActive, baseStats).hp;
                        }
                    }
                }

                if (!isNaN(cur)) {
                    if (!isNaN(max) && max > 0 && cur > max) {
                        // 인식된 수치가 최대 체력을 넘으면 스킵
                    } else if (myActiveIndex >= 0 && myActiveIndex < 6) {
                        if (!isNaN(max) && max > 0) {
                            currentHpFractionMy = cur / max;
                            currentMyHpText = "HP " + cur + " / " + max;
                        } else {
                            currentMyHpText = "HP " + cur;
                        }
                        
                        changed = true;
                        if (myParty[myActiveIndex]) {
                            myParty[myActiveIndex].currentHpFraction = currentHpFractionMy;
                            myParty[myActiveIndex].currentHpText = currentMyHpText;
                        }
                    }
                }
            }
            
            if (ev.opponentHpParsed !== undefined && ev.opponentHpParsed !== "") {
                let pct = parseFloat(ev.opponentHpParsed);
                if (!isNaN(pct) && pct <= 100 && opponentActiveIndex >= 0 && opponentActiveIndex < 6) {
                    currentHpFractionOpp = pct / 100.0;
                    currentOpponentHpText = "HP " + pct + "%";
                    changed = true;
                    
                    if (opponentParty[opponentActiveIndex]) {
                        opponentParty[opponentActiveIndex].currentHpFraction = currentHpFractionOpp;
                        opponentParty[opponentActiveIndex].currentHpText = currentOpponentHpText;
                    }
                }
            }

            if (changed) {
                let hpLogChanged = false;
                if (currentMyHpText && currentMyHpText !== lastLoggedMyHpText) {
                    hpLogChanged = true;
                    lastLoggedMyHpText = currentMyHpText;
                }
                if (currentOpponentHpText && currentOpponentHpText !== lastLoggedOppHpText) {
                    hpLogChanged = true;
                    lastLoggedOppHpText = currentOpponentHpText;

                if (hpLogChanged) {

                        const oId = opponentParty[opponentActiveIndex].SpeciesId || opponentParty[opponentActiveIndex].dexId;

                }
                renderAll();
            }
        });

        connection.on("BattleLogEvent", function (ev) {
            console.log("BattleLogEvent received:", ev);
            
            let sourceStr = ev.source === "My" ? "[내 포켓몬] " : (ev.source === "Opponent" ? "[상대 포켓몬] " : "");
            
            if (ev.eventType === "MegaEvolution") {
                const source = ev.source;
                const form = ev.payload || "Normal";
                
                let activeP = source === "My" ? myParty[myActiveIndex] : opponentParty[opponentActiveIndex];

                if (activeP) {
                    const originalId = activeP.SpeciesId || activeP.dexId;
                    let megaFound = null;
                    for (const key in masterDataMap) {
                        const m = masterDataMap[key];
                        if (m.isMegaForm && m.megaBaseSpeciesId === originalId) {
                            if (form === "X" && m.nameKo.endsWith("X")) { megaFound = m; break; }
                            if (form === "Y" && m.nameKo.endsWith("Y")) { megaFound = m; break; }
                            if (form === "Normal" && !m.nameKo.endsWith("X") && !m.nameKo.endsWith("Y")) { megaFound = m; break; }
                        }
                    }
                    if (!megaFound) {
                        for (const key in masterDataMap) {
                            const m = masterDataMap[key];
                            if (m.isMegaForm && m.megaBaseSpeciesId === originalId) {
                                megaFound = m; break;
                            }
                        }
                    }

                    if (megaFound) {
                        let formKey = (form === "X" || form === "Y") ? ("mega" + form) : "mega";
                        let newIconFile = String(originalId).padStart(4, '0') + "_" + formKey + ".png";
                        if (spritesDataMap[originalId] && spritesDataMap[originalId][formKey]) {
                            newIconFile = spritesDataMap[originalId][formKey];
                        }
                        
                        if (source === "My") {
                            myParty[myActiveIndex] = {
                                ...activeP,
                                SpeciesId: megaFound.id,
                                dexId: megaFound.id,
                                iconFile: newIconFile,
                                types: megaFound.types,
                                name: megaFound.nameKo,
                                NameKo: megaFound.nameKo
                            };
                        } else {
                            opponentParty[opponentActiveIndex] = {
                                ...activeP,
                                SpeciesId: megaFound.id,
                                dexId: megaFound.id,
                                iconFile: newIconFile,
                                types: megaFound.types,
                                name: megaFound.nameKo,
                                NameKo: megaFound.nameKo
                            };
                        }
                        
                        addLog(`${sourceStr}${megaFound.nameKo}(으)로 메가진화!`);
                    }
                }
            } else if (ev.eventType === "RankChange" && ev.payload) {
                const stat = ev.payload.stat.toLowerCase();
                const stages = ev.payload.stages;
                const statName = STAT_LABELS[stat] || stat;
                const sign = stages > 0 ? "+" : "";
                let currentName = "";
                if (ev.source === "My" && myParty[myActiveIndex]) {
                    currentName = myParty[myActiveIndex].name || dummyNames[myParty[myActiveIndex].SpeciesId || myParty[myActiveIndex].dexId] || "";
                } else if (ev.source === "Opponent" && opponentParty[opponentActiveIndex]) {
                    currentName = opponentParty[opponentActiveIndex].name || dummyNames[opponentParty[opponentActiveIndex].SpeciesId || opponentParty[opponentActiveIndex].dexId] || "";
                }
                let namePrefix = currentName ? `[${currentName}] ` : "";
                addLog(`${sourceStr}${namePrefix}랭크 변화: ${statName} ${sign}${stages}`);
                if (ev.source === "My") {
                    if (myRanks[stat] !== undefined) myRanks[stat] = Math.max(-6, Math.min(6, myRanks[stat] + stages));
                } else if (ev.source === "Opponent") {
                    if (opponentRanks[stat] !== undefined) opponentRanks[stat] = Math.max(-6, Math.min(6, opponentRanks[stat] + stages));
                }
            } else if (ev.eventType === "StatusChange" && ev.payload) {
                // payload: "PRZ"|"BRN"|"PSN"|"TOX"|"SLP"|"FRZ"|null
                const statusName = STATUS_LABEL[ev.payload] || ev.payload;
                addLog(`${sourceStr}상태 이상: ${statusName}`);
                
                if (ev.source === "My") myStatus = ev.payload || null;
                else if (ev.source === "Opponent") opponentStatus = ev.payload || null;
            } else if (ev.eventType === "WeatherChange" && ev.payload) {
                addLog(`날씨 변화: ${ev.payload}`);
                currentWeather = ev.payload;
                const weatherEl = document.getElementById("weatherSelect");
                if (weatherEl) weatherEl.value = currentWeather;
            } else if (ev.eventType === "BatonPass") {
                addLog(`${sourceStr}배턴터치 사용`);
                if (ev.source === "My") batonPassMy = true;
                else if (ev.source === "Opponent") batonPassOpp = true;
            } else if (ev.eventType === "Switch") {
                let targetIndex = ev.targetIndex !== undefined ? ev.targetIndex : -1;
                let prevName = "";
                
                if (targetIndex === -1) {
                    return; // Ignore completely if no valid Pokemon name was found
                }
                
                if (ev.source === "My") {
                    if (myActiveIndex >= 0 && myParty[myActiveIndex]) {
                        prevName = myParty[myActiveIndex].name || dummyNames[myParty[myActiveIndex].SpeciesId || myParty[myActiveIndex].dexId] || "???";
                    }
                } else if (ev.source === "Opponent") {
                    if (opponentActiveIndex >= 0 && opponentParty[opponentActiveIndex]) {
                        prevName = opponentParty[opponentActiveIndex].name || dummyNames[opponentParty[opponentActiveIndex].dexId || opponentParty[opponentActiveIndex].SpeciesId] || "???";
                    }
                }
                
                let nextName = "???";
                if (targetIndex !== -1) {
                    if (ev.source === "My") {
                        nextName = myParty[targetIndex].name || dummyNames[myParty[targetIndex].SpeciesId || myParty[targetIndex].dexId] || "???";
                    } else {
                        nextName = opponentParty[targetIndex].name || dummyNames[opponentParty[targetIndex].dexId || opponentParty[targetIndex].SpeciesId] || "???";
                    }
                } else if (ev.description) {
                    nextName = `(${ev.description.replace(/.*교체.*/, '').trim() || ev.description})`;
                }
                
                addLog(`${sourceStr}교체: ${prevName} -> ${nextName}`);
                
                if (ev.source === "My") {
                    // Ignore duplicate switches
                    if (targetIndex !== -1 && targetIndex !== myActiveIndex) {
                        if (batonPassMy) {
                            batonPassMy = false; // Ranks kept
                        } else {
                            myRanks = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
                            myStatus = null;
                        }
                        changeMyActive(targetIndex);
                    }
                } else if (ev.source === "Opponent") {
                    if (targetIndex !== -1 && targetIndex !== opponentActiveIndex) {
                        if (batonPassOpp) {
                            batonPassOpp = false; // Ranks kept
                        } else {
                            opponentRanks = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
                            opponentStatus = null;
                        }
                        changeOpponentActive(targetIndex);
                    }
                }
            }
            renderAll();
        });

        connection.on("BattleReset", function () {
            addLog("--- 배틀 상태가 초기화되었습니다 ---");
            myRanks = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
            opponentRanks = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
            myStatus = null;
            opponentStatus = null;
            currentWeather = null;
            opponentParty = []; // 파티 정보 초기화
            changeMyActive(-1);
            changeOpponentActive(-1);
            renderAll();
        });
        connection.start().then(function () {
            document.getElementById("connectionStatus").innerText = "배틀 로그 연동됨";
            document.getElementById("connectionStatus").style.color = "#43b581";
            addLog("서버와 배틀 로그 연동이 시작되었습니다.");
        }).catch(err => console.error(err.toString()));
        window.resetBattle = function () {
            connection.invoke("ResetBattle").catch(err => console.error(err.toString()));
        };

        renderAll();
    </script>
</body>

</html>
